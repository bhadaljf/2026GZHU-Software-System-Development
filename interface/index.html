<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>广州中考公办高中录取模拟</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <span class="brand">录取模拟</span>
  <nav id="nav">
    <button data-page="run" class="active">运行控制</button>
    <button data-page="student">考生查询</button>
    <button data-page="plan">计划与名单</button>
    <button data-page="stats">统计</button>
    <button data-page="case">案例对比</button>
  </nav>
  <span id="status" class="status">未运行</span>
</header>

<main>
  <section id="page-run" class="page active">
    <h2>运行控制</h2>
    <div class="row">
      <label>数据规模
        <select id="scale"><option value="small">小数据集</option><option value="large">15 万</option></select>
      </label>
      <button id="btn-run">完整运行</button>
      <button id="btn-batch3">只跑第三批</button>
    </div>
    <p id="run-info">装载数据后开始</p>
    <table id="balances"><thead><tr><th>批次</th><th>计划数</th><th>已录</th><th>余额</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="page-student" class="page">
    <h2>考生查询</h2>
    <div class="row"><input id="sid" placeholder="考生编号，如 S01"><button id="btn-student">查询</button></div>
    <div id="student-out" class="card"></div>
  </section>

  <section id="page-plan" class="page">
    <h2>计划与名单</h2>
    <div class="row"><input id="pid" placeholder="计划编号，如 P-A3"><button id="btn-plan">查询</button></div>
    <div id="plan-summary" class="card"></div>
    <table id="plan-rows"><thead><tr><th>顺序</th><th>考生</th><th>总分</th><th>志愿序号</th></tr></thead><tbody></tbody></table>
    <div class="row"><button id="prev">上一页</button><span id="page-info"></span><button id="next">下一页</button></div>
  </section>

  <section id="page-stats" class="page">
    <h2>统计</h2>
    <div class="row">
      <label>批次 <select id="stat-batch"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
      <button id="btn-stats">查询</button>
    </div>
    <div id="stats-out" class="card"></div>
  </section>

  <section id="page-case" class="page">
    <h2>案例对比</h2>
    <p class="hint">滑档案例：同一考生调整志愿前后两次运行的对比，数据来自 demo/cases/。</p>
    <div id="case-out" class="card">待 5 号提供案例数据后接入</div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
