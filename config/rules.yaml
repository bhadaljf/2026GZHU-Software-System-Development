# 规则参数：一次运行的全部外部输入（1 号维护；冻结后只增字段、不改语义）
year: 2026                  # 模拟年度
control_line: 492           # 全市公办高中最低控制线 L
gradient:
  first_line: 712           # 第一梯度线 G1（可人工设置；按前 10% 生成为选做）
  delta: 40                 # 梯度间隔 Δ
plan_ratio:
  self_recruit_cap: 0.10    # 第一批自主招生不超过总计划 10%
  quota_ratio: 0.50         # 名额分配占总计划比例
batch_volunteer_limit:      # 各批次志愿上限
  batch1: 1
  batch2: 3
  batch3: 6
  batch4: 6
data:                       # 2 号生成器读取；同种子同配置结果一致
  seed: 20261119
  students: 150000
  middle_schools: 500
  high_schools: 150
run:
  snapshot_prefix: RUN202612
